<svg width="500" height="700" viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f2e4"/>
      <stop offset="1" stop-color="#eadcc1"/>
    </linearGradient>
    <linearGradient id="brandPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2328"/>
      <stop offset="1" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#0a141a" stop-opacity="0.34"/>
    </linearGradient>
    <pattern id="camo" patternUnits="userSpaceOnUse" width="120" height="120">
      <rect width="120" height="120" fill="#58634a"/>
      <path d="M0 20 C18 4,40 4,64 20 C84 34,102 34,120 18 L120 48 C102 60,84 60,64 48 C40 34,18 36,0 54 Z" fill="#73815c"/>
      <path d="M0 74 C16 62,36 62,56 74 C76 86,98 88,120 78 L120 120 L0 120 Z" fill="#44513a"/>
      <ellipse cx="26" cy="96" rx="20" ry="10" fill="#2f3929"/>
      <ellipse cx="88" cy="44" rx="24" ry="12" fill="#657350"/>
      <ellipse cx="104" cy="100" rx="16" ry="8" fill="#273022"/>
    </pattern>
    <pattern id="diag" patternUnits="userSpaceOnUse" width="18" height="18" patternTransform="rotate(35)">
      <rect width="18" height="18" fill="none"/>
      <path d="M0 9 H18" stroke="#d5bd8f" stroke-opacity="0.11" stroke-width="1.8"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <clipPath id="innerClip">
      <rect x="22" y="22" width="456" height="656" rx="24"/>
    </clipPath>
  </defs>

  <rect x="10" y="10" width="480" height="680" rx="30" fill="url(#body)" stroke="#1f1f1f" stroke-width="8" filter="url(#shadow)"/>
  <rect x="18" y="18" width="464" height="664" rx="27" fill="none" stroke="#d1b071" stroke-width="2.1" opacity="0.9"/>

  <g clip-path="url(#innerClip)">
    <rect x="22" y="130" width="456" height="460" fill="url(#camo)"/>
    <rect x="22" y="130" width="456" height="460" fill="url(#diag)"/>
    <rect x="22" y="130" width="456" height="460" fill="url(#overlay)"/>
  </g>

  <rect x="26" y="26" width="448" height="116" rx="22" fill="url(#brandPanel)" stroke="#0f0a08" stroke-width="5"/>
  <text x="250" y="94" font-size="74" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" stroke="#0f0f0f" stroke-width="7" paint-order="stroke fill" font-family="Impact, Arial Black, Trebuchet MS, sans-serif" font-weight="900" letter-spacing="3">RisiKo!</text>

  <text x="250" y="226" font-size="50" text-anchor="middle" dominant-baseline="middle" fill="#101010" font-family="Trebuchet MS, Arial, sans-serif" font-weight="800">Nero</text>

  <g transform="translate(250 410)">
    <circle cx="0" cy="0" r="148" fill="#fffdf7" stroke="#222" stroke-width="6"/>
    <circle cx="0" cy="0" r="132" fill="#f2e3c6" stroke="#8b6d45" stroke-width="3"/>
    <circle cx="0" cy="0" r="116" fill="#232323" opacity="0.18"/>

    <circle cx="0" cy="0" r="94" fill="#f7f0df" stroke="#8b6d45" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="84" fill="#232323" stroke="#090909" stroke-width="5"/>

    <g fill="none" stroke="#8b6d45" stroke-width="2" opacity="0.85">
      <path d="M0 -118 L0 -100"/>
      <path d="M0 118 L0 100"/>
      <path d="M-118 0 L-100 0"/>
      <path d="M118 0 L100 0"/>
      <path d="M-84 -84 L-72 -72"/>
      <path d="M84 84 L72 72"/>
      <path d="M84 -84 L72 -72"/>
      <path d="M-84 84 L-72 72"/>
    </g>

    <g transform="translate(0 6)">
      <rect x="-52" y="22" width="104" height="20" rx="8" fill="#161616" opacity="0.9"/>
      <rect x="-42" y="8" width="84" height="18" rx="8" fill="#f5f5f5" stroke="#121212" stroke-width="3"/>
      <rect x="-15" y="0" width="40" height="10" rx="4" fill="#f5f5f5" stroke="#121212" stroke-width="3"/>
      <rect x="22" y="6" width="36" height="6" rx="3" fill="#f5f5f5" stroke="#121212" stroke-width="2"/>
      <circle cx="-28" cy="32" r="6" fill="#f5f5f5" stroke="#121212" stroke-width="2"/>
      <circle cx="0" cy="32" r="6" fill="#f5f5f5" stroke="#121212" stroke-width="2"/>
      <circle cx="28" cy="32" r="6" fill="#f5f5f5" stroke="#121212" stroke-width="2"/>
    </g>
  </g>

  <g fill="#d9be8e" stroke="#3a2c1a" stroke-width="1.6" opacity="0.9">
    <circle cx="52" cy="52" r="5"/>
    <circle cx="448" cy="52" r="5"/>
    <circle cx="52" cy="648" r="5"/>
    <circle cx="448" cy="648" r="5"/>
  </g>

  <text x="250" y="656" font-size="24" text-anchor="middle" dominant-baseline="middle" fill="#2d2d2d" font-family="Trebuchet MS, Arial, sans-serif" font-weight="700">Carta Giocatore</text>
</svg>
