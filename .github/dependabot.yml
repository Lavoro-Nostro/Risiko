version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "github_actions"
    groups:
      github-actions-all:
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "nuget"
    groups:
      nuget-all:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "npm"
    groups:
      npm-all:
        patterns:
          - "*"
