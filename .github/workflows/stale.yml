name: Stale Issues and PRs

on:
  schedule:
    - cron: '30 1 * * 1'
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: 'This issue is stale due to inactivity. It will be closed if no further activity occurs.'
          stale-pr-message: 'This PR is stale due to inactivity. It will be closed if no further activity occurs.'
          close-issue-message: 'Closing stale issue due to inactivity.'
          close-pr-message: 'Closing stale PR due to inactivity.'
          days-before-stale: 30
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: security,pinned
          exempt-pr-labels: security,pinned
